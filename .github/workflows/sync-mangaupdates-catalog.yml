name: Sync MangaUpdates catalog

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Preview candidates or ingest new series
        required: true
        default: preview
        type: choice
        options:
          - preview
          - sync
      recent_discovery_limit:
        description: Newest MangaUpdates results to inspect
        required: true
        default: "500"
        type: string
      max_new:
        description: Maximum candidate attempts across both tracks
        required: true
        default: "400"
        type: string
      max_recent:
        description: Maximum recent attempts before reserving history
        required: true
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: production-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Discover and ingest new manga
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.CATALOG_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_CATALOG_SYNC_ROLE_ARN: ${{ vars.AWS_CATALOG_SYNC_ROLE_ARN }}
      AWS_SECRETS_MANAGER_SECRET_ID: ${{ vars.BACKEND_RUNTIME_SECRET_ID }}

      MANGARECON_ENV: prod
      DEBUG: "false"
      FRONTEND_ORIGINS: https://mangarecon.com
      FRONTEND_URL: https://mangarecon.com

      COVER_STORAGE_BUCKET: ${{ vars.COVER_STORAGE_BUCKET }}
      COVER_PUBLIC_BASE_URL: https://mangarecon.com

      DATABASE_POOL_MODE: "null"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "10"
      DATABASE_COMMAND_TIMEOUT_SECONDS: "15"
      DATABASE_PREPARED_STATEMENT_CACHE_SIZE: "0"

      MANGAUPDATES_BASE_URL: https://api.mangaupdates.com/v1
      MANGAUPDATES_TIMEOUT_SECONDS: "10"
      MANGAUPDATES_MIN_REQUEST_INTERVAL_SECONDS: "1"
      MANGAUPDATES_USER_AGENT: MangaRecon/0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate scheduled-sync configuration
        shell: bash
        run: |
          for name in \
            AWS_REGION \
            AWS_CATALOG_SYNC_ROLE_ARN \
            AWS_SECRETS_MANAGER_SECRET_ID \
            COVER_STORAGE_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-prod.txt

      - name: Install production dependencies
        shell: bash
        run: |
          python -m pip install --upgrade "pip==26.2"
          python -m pip install --requirement requirements-prod.txt
          python -m pip check

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_CATALOG_SYNC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: MangaReconCatalogSync

      - name: Run bounded incremental sync
        shell: bash
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_RECENT_LIMIT: ${{ inputs.recent_discovery_limit }}
          MANUAL_MAX_NEW: ${{ inputs.max_new }}
          MANUAL_MAX_RECENT: ${{ inputs.max_recent }}
        run: |
          recent_discovery_limit="500"
          max_new="400"
          max_recent="300"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            recent_discovery_limit="$MANUAL_RECENT_LIMIT"
            max_new="$MANUAL_MAX_NEW"
            max_recent="$MANUAL_MAX_RECENT"
          fi

          arguments=(
            --recent-discovery-limit "$recent_discovery_limit"
            --max-new "$max_new"
            --max-recent "$max_recent"
            --historical-pages 5
            --per-page 100
            --minimum-year 1900
            --exclude-genre Hentai
          )

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_MODE" == "preview" ]]; then
            arguments+=(--preview)
          fi

          python -m backend.cli.run_scheduled_mangaupdates "${arguments[@]}"
